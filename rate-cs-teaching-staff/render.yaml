services:
  - type: web
    name: rate-cs-teaching-staff
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rate-teaching-staff-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: rate-teaching-staff-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: rate-teaching-staff-db
          property: password

databases:
  - name: rate-teaching-staff-db
    databaseName: rate_teaching_staff
    user: rate_teaching_staff_user
